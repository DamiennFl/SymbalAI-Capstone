# Pod disruption budget, this ensures that pods are
# disrupted one at a time during voluntary disruptions
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: <APPNAME>-pdb
spec:
  maxUnavailable: 1
  selector:
    matchLabels:
      app: <APPNAME>
